[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-neural-control-certificates"
version = "0.1.0"
description = "Reproducible sampled-data safety and practical-stability certificates around a neural controller"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yuanyuan Tao" }]
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
safecontrol = "safecontrol.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

