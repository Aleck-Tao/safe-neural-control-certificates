name: reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '35 1 * * 1'

jobs:
  test-and-reproduce:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11", byte-exact: "0"}
          - {os: ubuntu-latest, python-version: "3.12", byte-exact: "0"}
          - {os: ubuntu-latest, python-version: "3.13", byte-exact: "0"}
          - {os: windows-latest, python-version: "3.11", byte-exact: "0"}
          - {os: windows-latest, python-version: "3.12", byte-exact: "1"}
          - {os: windows-latest, python-version: "3.13", byte-exact: "0"}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SAFECONTROL_BYTE_EXACT: ${{ matrix.byte-exact }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -B -m unittest discover -s tests -v
      - run: safecontrol verify --root .
      - run: safecontrol reproduce --root . --semantic-check
      - run: safecontrol rho-sweep --root . --check
      - if: matrix.byte-exact == '1'
        run: safecontrol reproduce --root . --check
